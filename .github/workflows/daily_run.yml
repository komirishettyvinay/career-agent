name: Daily Job Hunt

on:
  schedule:
    - cron: '0 6 * * *'   # 6 AM UTC = 1 AM EST (2 AM EDT in summer)
  workflow_dispatch:        # lets you trigger manually from GitHub UI anytime

permissions:
  contents: read

concurrency:
  group: daily-job-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    # Detail enrichment adds source-specific API calls. Leave enough room for
    # the one-time backfill/rescore run as well as the normal daily pipeline.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate required secrets
        env:
          SPREADSHEET_ID:          ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          RESUME_TEXT:             ${{ secrets.RESUME_TEXT }}
        run: |
          for name in SPREADSHEET_ID GOOGLE_CREDENTIALS_JSON GROQ_API_KEY RESUME_TEXT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Run Job Hunter
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          GMAIL_SENDER:             ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT:          ${{ secrets.GMAIL_RECIPIENT }}
          SPREADSHEET_ID:           ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON:  ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GROQ_MODEL:               openai/gpt-oss-120b
          RESUME_TEXT:              ${{ secrets.RESUME_TEXT }}
        run: python main.py 2>&1 | tee job-hunter.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-hunter-log-${{ github.run_id }}
          path: job-hunter.log
          if-no-files-found: ignore
